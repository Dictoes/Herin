[auth]
# Verification emails must return to the public site, including on phones.
site_url = "https://herins.vercel.app/"
additional_redirect_urls = ["https://herins.vercel.app/"]

[functions.generate-study-content]
# Authentication is explicitly verified with auth.getUser in the handler.
# Supports both legacy JWT and new asymmetric signing keys.
verify_jwt = false

[functions.push-notifications]
# User actions verify auth.getUser; the scheduler uses a separate server secret.
verify_jwt = false

[functions.shared-pdf]
# Upload/remove actions verify auth.getUser; public check/download actions validate the share ID.
verify_jwt = false
